<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cliente web construido sobre front-template: React, Vite y Tailwind CSS." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>%VITE_APP_TITLE%</title>
    <!--
      Estampa el tema ANTES del primer pintado. ThemeProvider lo aplica en un efecto, es decir DESPUES
      de pintar: sin este script, un usuario con tema oscuro ve un destello claro en cada carga.
      La clave ('app_theme') y el valor por omision ('light') tienen que ser los de
      src/ui/theme/themeStorage.js; lo verifica ThemeProvider.test.jsx.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('app_theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <noscript>Esta aplicacion necesita JavaScript. / This application requires JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
