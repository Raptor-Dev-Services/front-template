# nginx del frontend en contenedor. SOLO sirve el bundle estatico: no hace de proxy hacia la API. El
# navegador habla directo con VITE_API_BASE_URL (horneada en el build), asi que nginx no interviene en
# esa ruta; un proxy aqui seria un segundo camino hacia la API que en desarrollo no existe.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # SPA: cualquier ruta que no sea un archivo la resuelve el router del cliente. Sin esto, recargar en
    # /users devuelve el 404 de nginx en vez de la app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre: son inmutables y se cachean para siempre. Sin `always` a
    # proposito: un 404 de un chunk que ya no existe NO debe quedar cacheado como inmutable.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html NO se cachea: es el unico archivo sin hash y decide que version corre. Con un
    # index.html viejo en cache, el navegador sigue pidiendo chunks que el despliegue ya borro (regla
    # client-version-skew). `no-cache` = revalidar siempre; si no cambio, es un 304 vacio.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
