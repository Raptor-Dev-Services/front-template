name: front-template-dev

# Servidor de desarrollo de Vite dentro de un contenedor. Alternativa a `npm run dev` en la maquina.
services:
  app:
    image: node:22-alpine
    working_dir: /app

    # 5179: 5173-5178 son de otros productos de esta maquina (devstack/PUERTOS.md del catalogo).
    ports:
      - "5179:5179"

    volumes:
      # El codigo montado, para que el HMR vea los cambios.
      - .:/app
      # node_modules dentro del contenedor: los binarios del host (Windows/Mac) no sirven en Alpine.
      - node_modules:/app/node_modules

    environment:
      # Polling: sin esto el HMR no detecta cambios dentro de Docker en Windows/Mac.
      CHOKIDAR_USEPOLLING: "true"
      # Dentro del contenedor `localhost` es el propio contenedor: la API del host se alcanza asi.
      # Las variables del proceso ganan a las de .env.dev.
      VITE_DEV_API_PROXY_TARGET: http://host.docker.internal:5060

    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

    # Resuelve host.docker.internal tambien en Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  node_modules:
