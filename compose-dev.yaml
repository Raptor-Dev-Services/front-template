name: front-template-dev

services:
  app:
    image: node:20-alpine
    working_dir: /app

    # Map container port 5173 → host — change host side if there are conflicts
    ports:
      - "5173:5173"

    volumes:
      # Mount source so hot-reload picks up changes
      - .:/app
      # Keep node_modules inside the container to avoid platform conflicts
      - node_modules:/app/node_modules

    env_file:
      - .env.dev

    environment:
      # Force file-system polling so Vite HMR works inside Docker on Windows/Mac
      CHOKIDAR_USEPOLLING: "true"
      VITE_POLL: "true"

    # Install (if needed) then start Vite bound to all interfaces
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

    # Lets the container reach the host machine as host.docker.internal (Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  node_modules:
