# Cabeceras de seguridad. Viven en un archivo aparte y se INCLUYEN en el server y en cada location
# porque nginx no hereda `add_header` hacia un location que declara los suyos: con las cabeceras solo
# en el server, /assets/ e index.html (que ponen su Cache-Control) salian sin ninguna.

# Clickjacking. frame-ancestors solo funciona como CABECERA (en el <meta> de la CSP se ignora); las dos
# lineas dicen lo mismo para navegadores nuevos y viejos. Si la app nunca se embebe, cambia a DENY y
# frame-ancestors 'none'.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS: activalo SOLO cuando este sitio se sirva siempre por HTTPS (normalmente lo pone el proxy o
# balanceador que termina TLS, no este contenedor, que escucha en http). Una vez enviado, el navegador
# se niega a entrar por http durante max-age: probar sin TLS te deja fuera.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
